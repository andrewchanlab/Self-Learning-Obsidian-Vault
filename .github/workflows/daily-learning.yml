name: Daily Learning Vault

on:
  # ============================================================
  # TEMPLATE USERS: Set to false to disable auto-schedule
  # ============================================================
  workflow_dispatch:
    inputs:
      message:
        description: 'Custom commit message (optional)'
        required: false
        type: string
      run_schedule:
        description: 'Enable daily schedule?'
        required: true
        type: choice
        options:
          - disabled
          - enabled

# ============================================================
# FORK USERS: Change 'andrewchanlab/Self-Learning-Obsidian-Vault'
# to your 'username/repo-name' below, or delete this 'if' line
# to allow forks to run.
# NOTE: To enable daily schedule, uncomment the 'schedule' block below.
# ============================================================
# schedule:
#   # Run at 7:00 AM HKT (23:00 UTC) daily
#   # Uncomment the line above to enable auto-schedule
#   - cron: '0 23 * * *'

  push:
    branches:
      - master

jobs:
  daily-learning:
    name: Generate Learning Points
    runs-on: ubuntu-latest
    
    # Only run on main repo, not forks
    if: github.repository == 'andrewchanlab/Self-Learning-Obsidian-Vault'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No external dependencies needed - uses stdlib only

      - name: Generate learning points
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: openai
          AI_MODEL: gpt-4o-mini
          VAULT_DIR: ${{ github.workspace }}
          GIT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          
          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Run the learning script
          if [ -n "${{ inputs.message }}" ]; then
            python scripts/daily-learning.sh --message "${{ inputs.message }}"
          else
            python scripts/daily-learning.sh
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-vault-${{ github.run_number }}
          path: |
            **/*.md
            !node_modules/**
          retention-days: 7

      - name: Check for changes
        id: check
        run: |
          git status --porcelain
          CHANGES=$(git status --porcelain)
          if [ -n "$CHANGES" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          
          if [ -n "${{ inputs.message }}" ]; then
            git commit -m "${{ inputs.message }}"
          else
            git commit -m "Daily learning update: $(date +%Y-%m-%d)"
          fi
          
          # Push using token
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: daily-learning
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "Daily learning job failed. Please check the logs."
          echo "Run: https://github.com/${{ github.repository }}/actions"
